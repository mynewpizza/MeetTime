<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminfinder Datums-Kalender</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .cell-selected { background-color: #10b981 !important; color: white; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-6xl w-full bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
    <h1 class="text-2xl font-bold mb-1 text-indigo-400">📅 Datums-Terminfinder</h1>
    <p class="text-xs text-slate-400 mb-4">Lege den Zeitraum fest, trage deinen Namen ein und wähle deine freien Stunden.</p>

    <!-- Zeitraum & Name Controls -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3 mb-6 p-4 bg-slate-900/60 rounded-lg border border-slate-700/60 text-xs">
      <div>
        <label class="block font-medium mb-1 text-slate-300">Dein Name:</label>
        <input id="username" type="text" placeholder="z. B. Alex" class="w-full p-2 bg-slate-700 border border-slate-600 rounded text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block font-medium mb-1 text-slate-300">Startdatum:</label>
        <input id="start-date" type="date" class="w-full p-2 bg-slate-700 border border-slate-600 rounded text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block font-medium mb-1 text-slate-300">Enddatum:</label>
        <input id="end-date" type="date" class="w-full p-2 bg-slate-700 border border-slate-600 rounded text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div class="flex items-end">
        <button onclick="copyLink()" class="w-full bg-indigo-600 hover:bg-indigo-500 p-2 rounded text-white font-medium transition">Link kopieren</button>
      </div>
    </div>

    <!-- Kalender Raster (Scrollbar wenn viele Tage) -->
    <div class="overflow-x-auto mb-6">
      <div id="calendar-container" class="min-w-max">
        <!-- Header (Tage) -->
        <div id="calendar-header" class="grid gap-1 mb-1 text-center font-bold text-xs text-indigo-300"></div>
        <!-- Stunden Zeilen -->
        <div id="calendar-grid" class="space-y-1"></div>
      </div>
    </div>

    <!-- Live Auswertung -->
    <div class="border-t border-slate-700 pt-4">
      <h3 class="font-semibold text-sm mb-2 text-indigo-300">Eingetragene Personen:</h3>
      <div id="results" class="text-xs space-y-1 text-slate-300 max-h-40 overflow-y-auto">
        Warte auf Daten...
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ DEINE FIREBASE CONFIG HIER EINFÜGEN ⚠️
    const firebaseConfig = {
      apiKey: "AIzaSyAwL4VAhz83s3hn5qmNGv295ir2hSB6xL0",
      projectId: "meettime-d9ad6",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let roomId = window.location.hash.replace('#room=', '');
    if (!roomId) {
      roomId = 'room-' + Math.random().toString(36).substring(2, 8);
      window.location.hash = `room=${roomId}`;
    }

    const roomRef = doc(db, "rooms", roomId);
    const hours = Array.from({length: 15}, (_, i) => i + 8); // 8:00 - 22:00 Uhr
    let mySelectedSlots = new Set();
    let roomData = {};
    let activeDays = [];

    // Standard-Datumsbereich setzen (Heute bis +13 Tage)
    const startDateInput = document.getElementById('start-date');
    const endDateInput = document.getElementById('end-date');
    const nameInput = document.getElementById('username');

    const today = new Date();
    const future = new Date();
    future.setDate(today.getDate() + 13);

    startDateInput.value = today.toISOString().split('T')[0];
    endDateInput.value = future.toISOString().split('T')[0];
    nameInput.value = localStorage.getItem('user_name') || '';

    // Events für Intervall-Änderungen
    startDateInput.addEventListener('change', updateRange);
    endDateInput.addEventListener('change', updateRange);
    nameInput.addEventListener('input', (e) => {
      localStorage.setItem('user_name', e.target.value);
      saveData();
    });

    function getDatesInRange(startStr, endStr) {
      const dates = [];
      let current = new Date(startStr);
      const end = new Date(endStr);
      while (current <= end) {
        const dayName = current.toLocaleDateString('de-DE', { weekday: 'short' });
        const dateStr = current.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
        const iso = current.toISOString().split('T')[0];
        dates.push({ label: `${dayName} ${dateStr}`, iso });
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    function buildGrid() {
      activeDays = getDatesInRange(startDateInput.value, endDateInput.value);
      const headerEl = document.getElementById('calendar-header');
      const gridEl = document.getElementById('calendar-grid');

      headerEl.style.gridTemplateColumns = `60px repeat(${activeDays.length}, minmax(70px, 1fr))`;
      headerEl.innerHTML = '<div class="py-2">Zeit</div>' + activeDays.map(d => `<div class="py-2 px-1 bg-slate-800/80 rounded">${d.label}</div>`).join('');

      gridEl.innerHTML = '';
      hours.forEach(hour => {
        const row = document.createElement('div');
        row.className = "grid gap-1 text-xs text-center";
        row.style.gridTemplateColumns = `60px repeat(${activeDays.length}, minmax(70px, 1fr))`;

        const timeCell = document.createElement('div');
        timeCell.className = "p-2 bg-slate-800 text-slate-400 font-mono text-[10px] flex items-center justify-center";
        timeCell.innerText = `${hour}:00`;
        row.appendChild(timeCell);

        activeDays.forEach(day => {
          const slotId = `${day.iso}_${hour}`;
          const cell = document.createElement('button');
          cell.id = `cell-${slotId}`;
          cell.className = "p-2 bg-slate-700/60 hover:bg-slate-600 rounded border border-slate-700 transition h-8";
          
          if (mySelectedSlots.has(slotId)) {
            cell.classList.add('cell-selected');
          }

          cell.onclick = () => {
            if (mySelectedSlots.has(slotId)) {
              mySelectedSlots.delete(slotId);
              cell.classList.remove('cell-selected');
            } else {
              mySelectedSlots.add(slotId);
              cell.classList.add('cell-selected');
            }
            saveData();
          };
          row.appendChild(cell);
        });

        gridEl.appendChild(row);
      });
    }

    async function updateRange() {
      buildGrid();
      await saveData();
    }

    async function saveData() {
      const name = nameInput.value.trim();
      if (!name) return;

      await setDoc(roomRef, {
        config: {
          start: startDateInput.value,
          end: endDateInput.value
        },
        users: {
          [name]: Array.from(mySelectedSlots)
        }
      }, { merge: true });
    }

    onSnapshot(roomRef, (snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.data();
        if (data.config) {
          if (data.config.start !== startDateInput.value || data.config.end !== endDateInput.value) {
            startDateInput.value = data.config.start;
            endDateInput.value = data.config.end;
            buildGrid();
          }
        }
        roomData = data.users || {};
        renderResults();
      }
    });

    function renderResults() {
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '';
      const users = Object.keys(roomData);

      if (users.length === 0) {
        resultsEl.innerHTML = '<i>Noch keine Eintragungen vorhanden.</i>';
        return;
      }

      users.forEach(user => {
        const slots = roomData[user] || [];
        const div = document.createElement('div');
        div.className = "p-2 bg-slate-700/40 rounded border border-slate-700 mb-1";
        div.innerHTML = `<b class="text-indigo-300">${user}</b> (${slots.length} Stunden ausgewählt)`;
        resultsEl.appendChild(div);
      });
    }

    buildGrid();

    window.copyLink = () => {
      navigator.clipboard.writeText(window.location.href);
      alert('Link kopiert! Sende ihn an deine Freunde.');
    };
  </script>
</body>
</html>
